<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Go File Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%81%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // Apply the stored theme before first paint to avoid a flash.
    (function () {
      var stored = localStorage.getItem("theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">📁</span>
      <span>Go File Manager</span>
    </div>
    <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb"></nav>
    <button id="view-toggle" class="btn icon-btn" type="button" aria-label="Toggle grid view" title="Toggle list/grid view">▦</button>
    <button id="theme-toggle" class="btn icon-btn" type="button" aria-label="Toggle theme" title="Toggle light/dark theme">🌙</button>
  </header>

  <main>
    <div id="status" class="status" role="alert" hidden></div>
    <div class="toolbar">
      <input
        id="filter"
        class="filter-input"
        type="search"
        placeholder="Filter this folder…"
        autocomplete="off"
        aria-label="Filter files in this folder"
      >
      <span class="item-count" id="item-count" aria-live="polite"></span>
    </div>
    <table class="listing">
      <thead>
        <tr>
          <th><button type="button" class="sort" data-key="name">Name<span class="sort-arrow" aria-hidden="true"></span></button></th>
          <th class="col-size"><button type="button" class="sort" data-key="size">Size<span class="sort-arrow" aria-hidden="true"></span></button></th>
          <th class="col-time"><button type="button" class="sort" data-key="time">Modified<span class="sort-arrow" aria-hidden="true"></span></button></th>
          <th class="col-actions"><span class="visually-hidden">Actions</span></th>
        </tr>
      </thead>
      <tbody id="listing-body"></tbody>
    </table>
    <div class="grid" id="grid" hidden></div>
    <footer class="footer" id="footer" hidden>
      <div class="disk">
        <span class="disk-label">Disk</span>
        <div class="disk-bar"><div class="disk-bar-fill" id="disk-fill"></div></div>
        <span class="disk-text" id="disk-text" aria-live="polite"></span>
      </div>
      <div class="host" id="host-info"></div>
    </footer>
  </main>

  <div class="viewer" id="viewer" hidden>
    <div class="viewer-panel" role="dialog" aria-modal="true" aria-labelledby="viewer-name">
      <div class="viewer-head">
        <span class="viewer-title" id="viewer-name"></span>
        <div class="viewer-actions">
          <button id="viewer-edit" class="btn when-browse" type="button">Edit</button>
          <button id="viewer-save" class="btn when-edit" type="button">Save</button>
          <button id="viewer-cancel" class="btn when-edit" type="button">Cancel</button>
          <button id="viewer-rename" class="btn when-browse" type="button">Rename</button>
          <button id="viewer-delete" class="btn danger when-browse" type="button">Delete</button>
          <a id="viewer-download" class="btn when-browse" href="#" download>Download</a>
          <button id="viewer-close" class="btn when-browse" type="button">Close</button>
        </div>
      </div>
      <pre class="viewer-body" id="viewer-body"></pre>
      <textarea id="viewer-editor" class="viewer-editor" spellcheck="false" hidden></textarea>
    </div>
  </div>

  <div class="context-menu" id="context-menu" role="menu" hidden></div>

  <div class="modal" id="confirm-modal" hidden>
    <div
      class="modal-panel"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-message"
    >
      <h2 class="modal-title" id="confirm-title"></h2>
      <p class="modal-message" id="confirm-message"></p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="btn" type="button">Cancel</button>
        <button id="confirm-ok" class="btn danger" type="button">Delete</button>
      </div>
    </div>
  </div>

  <div class="modal" id="prompt-modal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="prompt-title">
      <h2 class="modal-title" id="prompt-title"></h2>
      <input id="prompt-input" class="prompt-input" type="text" autocomplete="off" spellcheck="false">
      <div class="modal-actions">
        <button id="prompt-cancel" class="btn" type="button">Cancel</button>
        <button id="prompt-ok" class="btn" type="button">Create</button>
      </div>
    </div>
  </div>

  <input id="file-input" type="file" multiple hidden>

  <script src="/static/app.js"></script>
</body>
</html>
